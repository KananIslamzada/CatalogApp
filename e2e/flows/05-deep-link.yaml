appId: com.catalogapp.mobile
name: A product link opened while signed out continues after sign in
tags:
  - deep-links
---
- launchApp:
    clearState: true
    clearKeychain: true
- stopApp
- openLink: catalog://product/42
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      USERNAME: emilys
      PASSWORD: emilyspass
- extendedWaitUntil:
    visible:
      id: product-title
    timeout: 20000
- assertVisible: 'About this product'

- tapOn:
    id: product-back
- extendedWaitUntil:
    visible: 'Hi, Emily'
    timeout: 10000
